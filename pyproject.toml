[build-system]
requires = ["hatchling>=1.32.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "migration-agent"
version = "0.1.0"
description = "A controlled, evidence-based code migration workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0,<3.0.0",
    "openai-agents>=0.22.0,<1.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "typer>=0.27.2,<1.0.0",
]

[project.scripts]
agent = "migration_agent.cli:app"
migration-agent = "migration_agent.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.8,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/migration_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "live: marks tests that interact with live external model APIs (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.uv]
required-version = ">=0.12.15,<0.13.0"

